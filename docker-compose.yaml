services:
  # CONTENEDOR 1: Tu API de prueba (que luego será la real)
  servicio_api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
      - ./uploads:/uploads # Carpeta compartida para imágenes
    environment:
      - DB_SERVER=cacao_db
      - DB_USER=SA
      - DB_PASSWORD=Cacao_Secure_2026!
    ports:
      - "8000:8000"

  # CONTENEDOR 2: Tu Backend de prueba (que luego será el real)
  servicio_backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./api/app/models:/app/app/models
      - ./api/app/core:/app/app/core
      - ./uploads:/uploads # Carpeta compartida para imágenes
    environment:
      - DB_SERVER=cacao_db
      - DB_USER=SA
      - DB_PASSWORD=Cacao_Secure_2026!
      # --- VARIABLES DE RUNPOD ---
      - RUNPOD_API_URL=http://86.200.48.42:10077
      - RUNPOD_WS_URL=ws://86.200.48.42:10077

  # CONTENEDOR 3: Base de Datos SQL Server (Nuevo servicio)
  db_service:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cacao_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Cacao_Secure_2026!
    ports:
      - "1434:1433" # <-- ¡Evitamos el choque de puertos usando el 1434 en Windows!
    volumes:
      - db_data:/var/opt/mssql
      - ./db/init.sql:/init.sql
  # Contenedor 4: Servicio de frontend
  servicio_frontend:
    build: ./frontend
    container_name: docker_ia_servicio_frontend
    ports:
      - "8443:8443"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - PORT=8443
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - servicio_api
volumes:
  db_data: